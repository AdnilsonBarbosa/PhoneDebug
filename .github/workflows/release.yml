name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build release package
        shell: pwsh
        run: ./build-release.ps1

      - name: Collect artefacts
        id: package
        shell: pwsh
        run: |
          $zip = Get-ChildItem ./dist -Filter *.zip | Select-Object -First 1
          $dir = Get-ChildItem ./dist -Directory | Select-Object -First 1
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "cli=$($dir.FullName)\phone-debug.exe" >> $env:GITHUB_OUTPUT
          "app=$($dir.FullName)\PhoneDebug.exe" >> $env:GITHUB_OUTPUT

      - name: Sign artefacts with build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/**/*.zip
            dist/**/phone-debug.exe
            dist/**/PhoneDebug.exe

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem ./dist -Recurse -File |
            Where-Object { $_.Extension -in ".zip", ".exe" }
          foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash
            Add-Content -LiteralPath ./dist/SHA256SUMS.txt \
              "$hash  $($file.Name)"
          }
          Get-Content ./dist/SHA256SUMS.txt

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.cli }}
            ${{ steps.package.outputs.app }}
            dist/SHA256SUMS.txt
          generate_release_notes: true
