name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build release package
        shell: pwsh
        run: ./build-release.ps1

      - name: Collect artefacts
        id: package
        shell: pwsh
        run: |
          $zip = Get-ChildItem ./dist -Filter *.zip | Select-Object -First 1
          $dir = Get-ChildItem ./dist -Directory | Select-Object -First 1
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "cli=$($dir.FullName)\phone-debug.exe" >> $env:GITHUB_OUTPUT
          "app=$($dir.FullName)\PhoneDebug.exe" >> $env:GITHUB_OUTPUT

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.cli }}
            ${{ steps.package.outputs.app }}
          generate_release_notes: true
